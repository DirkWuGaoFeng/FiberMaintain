syntax = "proto3";
package fiber.topology;
import "common.proto";

service TopologyService {
    rpc CreateFiber(CreateFiberRequest) returns (CreateFiberResponse);
    rpc DeleteFiber(DeleteFiberRequest) returns (DeleteFiberResponse);
    rpc GetFiber(GetFiberRequest) returns (GetFiberResponse);
    rpc BatchGetFibers(BatchGetFibersRequest) returns (BatchGetFibersResponse);
    rpc GetFibersByPort(GetFibersByPortRequest) returns (GetFibersByPortResponse);
    rpc GetFiberScene(GetFiberSceneRequest) returns (GetFiberSceneResponse);
    rpc SubscribeFiberEvents(SubscribeFiberEventsRequest) returns (stream FiberEvent);
    rpc HealthCheck(HealthCheckRequest) returns (fiber.common.HealthCheckResponse);
}

message CreateFiberRequest {
    int32 src_board_id = 1;
    int32 src_port_id = 2;
    int32 dst_board_id = 3;
    int32 dst_port_id = 4;
}

message CreateFiberResponse {
    bool success = 1;
    int32 fiber_id = 2;
    string message = 3;
}

message DeleteFiberRequest {
    int32 fiber_id = 1;
}

message DeleteFiberResponse {
    bool success = 1;
    string message = 2;
}

message GetFiberRequest {
    int32 fiber_id = 1;
}

message GetFiberResponse {
    fiber.common.FiberInfo fiber = 1;
}

message BatchGetFibersRequest {
    repeated int32 fiber_ids = 1;
}

message BatchGetFibersResponse {
    repeated FiberResult results = 1;
}

message FiberResult {
    bool found = 1;
    fiber.common.FiberInfo fiber = 2;
    string error_message = 3;
}

message GetFibersByPortRequest {
    int32 board_id = 1;
    int32 port_id = 2;
}

message GetFibersByPortResponse {
    repeated fiber.common.FiberInfo fibers = 1;
}

message SubscribeFiberEventsRequest {}

message FiberEvent {
    fiber.common.FiberEventType event_type = 1;
    int32 fiber_id = 2;
    string timestamp = 3;
}

message GetFiberSceneRequest {
    int32 inter_ne_fiber_id = 1;
}

message FiberSceneInfo {
    int32 scene_type = 1;
    int32 inter_ne_fiber_id = 2;
    fiber.common.FiberInfo inter_ne_fiber = 3;
    
    fiber.common.BoardInfo src_active_board = 4;
    fiber.common.BoardInfo dst_active_board = 5;
    
    repeated fiber.common.FiberInfo ne_internal_fibers = 6;
    repeated fiber.common.BoardInfo passive_boards = 7;
}

message GetFiberSceneResponse {
    bool found = 1;
    FiberSceneInfo scene = 2;
    string error_message = 3;
}

message HealthCheckRequest {}