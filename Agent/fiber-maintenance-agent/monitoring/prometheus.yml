global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fiber-agent'
    static_configs:
      - targets: ['deerflow:8000']
    metrics_path: /metrics

  - job_name: 'fiber-backend'
    static_configs:
      - targets: ['fiber-backend:8080']
    metrics_path: /metrics