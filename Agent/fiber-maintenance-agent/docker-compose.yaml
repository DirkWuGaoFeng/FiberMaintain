version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports: ["8100:8000"]
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  fiber-backend:
    build:
      context: ./fiber-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - backend_data:/data
      - backend_logs:/var/log/fiber-backend
    restart: unless-stopped

  deerflow:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./knowledge_base:/app/knowledge_base
      - ./skills:/app/skills
      - ./plugins:/app/plugins
      - agent_logs:/var/log/fiber-agent
      - report_tmp:/tmp/fiber_reports
      - agent_data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - FIBER_BACKEND_URL=http://fiber-backend:8080
      - FIBER_WS_URL=ws://fiber-backend:8081
    depends_on:
      - ollama
      - chromadb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    environment:
      - VITE_FIBER_REST_URL=http://fiber-backend:8080
      - VITE_FIBER_WS_URL=ws://fiber-backend:8081
    depends_on:
      - deerflow
      - fiber-backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
  backend_data:
  backend_logs:
  agent_logs:
  report_tmp:
  agent_data:
  prometheus_data:
  grafana_data: