# Prompt 回归测试用例
# 用于验证 Prompt 修改后的输出质量

test_cases:
  # ============================================================
  # 意图识别测试
  # ============================================================
  - name: "单条光纤查询"
    input: "帮我查一下 FIB-001 的连接关系"
    expected:
      intent: "single_query"
      fiber_ids: ["FIB-001"]
      confidence_min: 0.8

  - name: "批量光纤查询"
    input: "查询 NE-01 下所有光纤的连接状态"
    expected:
      intent: "batch_query"
      ne_id: "NE-01"
      confidence_min: 0.7

  - name: "Spanloss 分析"
    input: "分析一下 FIB-003 最近的跨段损耗情况"
    expected:
      intent: "spanloss_analysis"
      fiber_ids: ["FIB-003"]
      confidence_min: 0.8

  - name: "颜色诊断"
    input: "FIB-005 怎么变红了？什么原因？"
    expected:
      intent: "color_diagnosis"
      fiber_ids: ["FIB-005"]
      confidence_min: 0.85

  - name: "趋势分析"
    input: "看看 FIB-010 最近一个月的性能趋势"
    expected:
      intent: "trend_analysis"
      fiber_ids: ["FIB-010"]
      time_range: "最近一个月"
      confidence_min: 0.75

  - name: "健康检查"
    input: "检查一下所有光纤的健康状态"
    expected:
      intent: "health_check"
      confidence_min: 0.7

  - name: "报告生成"
    input: "生成今天的光纤维护日报"
    expected:
      intent: "report_generation"
      confidence_min: 0.8

  - name: "知识问答"
    input: "OTDR 测试的标准流程是什么？"
    expected:
      intent: "knowledge_qa"
      confidence_min: 0.8

  - name: "闲聊"
    input: "你好，你是谁？"
    expected:
      intent: "chitchat"
      confidence_min: 0.7

  # ============================================================
  # 边界测试
  # ============================================================
  - name: "多意图 - 分析+报告"
    input: "分析 FIB-001 的 spanloss 并生成报告"
    expected:
      intent: "report_generation"
      confidence_min: 0.6

  - name: "模糊查询"
    input: "网络好像有点问题"
    expected:
      intent: "chitchat"
      confidence_max: 0.5
