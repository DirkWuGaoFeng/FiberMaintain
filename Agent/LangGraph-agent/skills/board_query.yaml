# Skill: 单盘查询 (Fast Path) | 覆盖: R011
id: board_query
name: 单盘查询
version: "1.0"
description: "查询单盘信息（类型、网元、端口状态）"

triggers:
  - pattern: "(?:查|看|查询)\\s*(\\d+)\\s*号?\\s*(?:盘|单盘|板)\\s*(?:的)?\\s*(?:信息|状态)"
    params:
      board_id: { group: 1, type: int }
    confidence: 1.0

routing:
  intent: single_query
  group: data_query
  fast_path_eligible: true
  template_id: T_BOARD

tools:
  - id: query_board
    endpoint: "/api/v1/boards/{board_id}"
    method: GET
    timeout: 2.0
    params:
      board_id: "{board_id}"
    response_extract: {}

template:
  fast_path: "单盘 {board_id} 信息：{data}"
  status_map: {}

collector_tools:
  - board_query
  - board_fibers_query

test_cases:
  - input: "查3号盘的信息"
    expected_intent: single_query
    expected_params: { board_id: 3 }
    expected_fast_path: true
