# Skill: 报告生成 (Normal Path) | 覆盖: R060
id: report_generation
name: 报告生成
version: "1.0"
description: "生成光纤维护报告（日报/周报/巡检报告）"

triggers:
  - pattern: "(?:生成|写|出)\\s*(?:本周|今日|本月|巡检|维护)?\\s*(?:报告|报表)"
    params: {}
    confidence: 1.0

routing:
  intent: report_generation
  group: report
  fast_path_eligible: false
  template_id: ""

tools: []

collector_tools:
  - fiber_stats_query
  - fiber_performance_query
  - alarm_query
  - export_pdf
  - export_excel

test_cases:
  - input: "生成本周报告"
    expected_intent: report_generation
    expected_params: {}
    expected_fast_path: false
  - input: "生成巡检报告"
    expected_intent: report_generation
    expected_params: {}
    expected_fast_path: false
