# ============================================================
# Fiber Agent Frontend — Nginx 配置
# 静态资源 + API 反向代理（Agent / C++ 后端 / WebSocket）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 静态资源长缓存（Vite hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== Agent 专属 API（长路径优先） =====
    location /api/v1/knowledge {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    location /api/v1/threads {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/graph {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/memory {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/metrics {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/degradation {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/rules {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/batch {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== C++ 后端 API Gateway =====
    location /api/v1 {
        proxy_pass http://fiber-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== WebSocket 实时事件（C++ 后端） =====
    location /ws/v1 {
        proxy_pass http://fiber-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ===== LangServe Agent 路由（SSE 流式） =====
    location /fiber-agent {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 必需：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /invoke {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://langgraph-app:8000;
        proxy_set_header Host $host;
    }

    # ===== SPA History 路由兜底 =====
    location / {
        try_files $uri $uri/ /index.html;
    }
}
